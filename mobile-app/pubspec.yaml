name: erp_warehouse_mobile
description: "Cross-platform Mobile & Desktop App for Enterprise ERP Warehouse & Inventory"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  dio: ^5.7.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  mobile_scanner: ^5.0.0
  intl: ^0.19.0
  flutter_riverpod: ^2.5.1
  window_manager: ^0.3.9
  decimal: ^2.3.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
